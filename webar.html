<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#1A1A4E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="diat-styles.css"/>
  <meta name="description" content="View DIAT indigenous artworks in augmented reality. Place student-created craft objects in your physical space."/>
  <title>WebAR Viewer — DIAT | KNUST Ghana</title>
</head>
<body data-page="webar">
<a href="#main-content" class="skip-link">Skip to main content</a>
<main id="main-content">

    <!-- WebAR layout: sidebar + stage (no footer shown in viewer mode) -->
    <div class="webar-layout" aria-label="WebAR artwork viewer">

      <!-- Artwork selector sidebar -->
      <aside class="webar-sidebar" aria-label="Select artwork to view">
        <h2 class="webar-sidebar__heading">Artworks in AR</h2>
        <p style="font-size:var(--fs-xs);color:rgba(255,255,255,.35);margin-bottom:var(--sp-md)">
          Select an artwork to view it in 3D. Tap &#127918; on mobile to place in your space.
        </p>
        <div id="artwork-list" role="list" aria-label="Artwork list">
          <!-- Populated by JS -->
        </div>
        <div style="margin-top:auto;padding-top:var(--sp-lg);border-top:1px solid rgba(255,255,255,.08)">
          <a href="gallery.html" class="btn btn--ghost-light btn--sm" style="width:100%;justify-content:center">
            &#8592; Full Gallery
          </a>
        </div>
      </aside>

      <!-- 3D viewer stage -->
      <div class="webar-stage" id="webar-stage" aria-label="3D artwork viewer">
        <div id="viewer-container" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">
          <div style="text-align:center;color:var(--clr-text-tertiary)">
            <p style="font-size:3rem;margin-bottom:var(--sp-md)" aria-hidden="true">&#127918;</p>
            <p style="font-family:var(--ff-display);font-size:var(--fs-lg);color:var(--clr-text-secondary);margin-bottom:var(--sp-sm)">
              Select an artwork to begin
            </p>
            <p style="font-size:var(--fs-sm)">Choose from the list on the left to view in 3D</p>
          </div>
        </div>
      </div>
    </div>

  </main>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <script>
    var ARTWORKS = [];

    var currentArt = null;

    function buildList() {
      var list = document.getElementById('artwork-list');
      if (!list) return;
      var arWorks = ARTWORKS.filter(function(a) { return a.ar && a.glb; });
      if (arWorks.length === 0) {
        list.innerHTML = '<p style="color:rgba(255,255,255,.35);font-size:var(--fs-sm)">No AR artworks uploaded yet.</p>';
        return;
      }
      list.innerHTML = arWorks.map(function(art, i) {
        return '<button class="webar-artwork-btn" onclick="loadArtwork(' + i + ')" role="listitem">' +
               '<span class="webar-artwork-btn__name">' + (art.title || 'Artwork ' + (i+1)) + '</span>' +
               '<span class="webar-artwork-btn__disc">' + (art.disciplineLabel || art.discipline || '') + '</span>' +
               '</button>';
      }).join('');
    }

    function loadArtwork(i) {
      var arWorks = ARTWORKS.filter(function(a) { return a.ar && a.glb; });
      var art = arWorks[i];
      if (!art) return;
      currentArt = art;
      document.querySelectorAll('.webar-artwork-btn').forEach(function(b, j) {
        b.classList.toggle('is-active', j === i);
      });
      var stage = document.getElementById('viewer-container');
      stage.innerHTML =
        '<model-viewer' +
        ' src="' + art.glb + '"' +
        ' alt="' + (art.title || 'DIAT artwork') + ' — 3D model"' +
        ' ar ar-modes="webxr scene-viewer quick-look"' +
        ' camera-controls touch-action="pan-y"' +
        ' auto-rotate rotation-per-second="15deg"' +
        ' style="width:100%;height:100%;min-height:500px;background:transparent">' +
        '<button slot="ar-button" class="btn btn--primary btn--md"' +
        ' style="position:absolute;bottom:var(--sp-lg);right:var(--sp-lg)">' +
        '&#127918; View in AR</button>' +
        '</model-viewer>';
    }

    /* Check URL param for direct artwork link */
    document.addEventListener('DOMContentLoaded', function() {
      buildList();
      var params = new URLSearchParams(window.location.search);
      var artTitle = params.get('art');
      if (artTitle) {
        var arWorks = ARTWORKS.filter(function(a) { return a.ar && a.glb; });
        var idx = arWorks.findIndex(function(a) { return a.title === artTitle; });
        if (idx >= 0) loadArtwork(idx);
      }
    });
  </script>
    <script src="site.js"></script>
  <script src="cms.js?v=3"></script>
</body>
</html>
