<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#1A1A4E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="diat-styles.css"/>
  <meta name="description" content="Browse the DIAT artwork collection — indigenous craft works across Clay, Fibres, Leather, Metal, Rattan, and Wood disciplines at KNUST Ghana."/>
  <title>Artwork Gallery — DIAT | KNUST Ghana</title>
</head>
<body data-page="gallery">
<a href="#main-content" class="skip-link">Skip to main content</a>
<main id="main-content">

    <section class="page-hero" aria-labelledby="gallery-title">
      <div class="container">
        <nav class="page-hero__breadcrumb" aria-label="Breadcrumb">
          <a href="index.html" class="page-hero__breadcrumb-link">Home</a>
          <span class="page-hero__breadcrumb-sep" aria-hidden="true">/</span>
          <span class="page-hero__breadcrumb-current">Gallery</span>
        </nav>
        <span class="page-hero__eyebrow">The Collection</span>
        <h1 class="page-hero__title" id="gallery-title"
            data-cms-key="gallery-hero-title" data-cms-label="Gallery Title" data-cms-type="text">
          Artwork Gallery
        </h1>
        <p class="page-hero__body"
           data-cms-key="gallery-hero-body" data-cms-label="Gallery Body">
          Artworks created by DIAT students and staff across all six indigenous craft disciplines
          &mdash; Clay, Fibres, Leather, Metal, Rattan &amp; Bamboo, and Wood &amp; Furniture.
        </p>
        <div class="page-hero__rule" aria-hidden="true"></div>
      </div>
    </section>

    <section class="dept-section dept-section--surface" aria-label="Artwork gallery">
      <div class="container">
        <!-- Filter controls -->
        <div class="gallery-controls" role="group" aria-label="Filter artworks by discipline">
          <button class="gallery-filter is-active" onclick="filterGallery('all')"
                  aria-pressed="true">All Works</button>
          <button class="gallery-filter" onclick="filterGallery('clay')"
                  aria-pressed="false">Clay &amp; Earthenware</button>
          <button class="gallery-filter" onclick="filterGallery('fibres')"
                  aria-pressed="false">Fibres &amp; Fabrics</button>
          <button class="gallery-filter" onclick="filterGallery('leather')"
                  aria-pressed="false">Leather Technology</button>
          <button class="gallery-filter" onclick="filterGallery('metal')"
                  aria-pressed="false">Metal Production</button>
          <button class="gallery-filter" onclick="filterGallery('rattan')"
                  aria-pressed="false">Rattan &amp; Bamboo</button>
          <button class="gallery-filter" onclick="filterGallery('wood')"
                  aria-pressed="false">Wood &amp; Furniture</button>
          <button class="gallery-filter" onclick="filterGallery('ar')"
                  aria-pressed="false">&#127918; WebAR Ready</button>
        </div>

        <!-- Masonry grid — populated by JS -->
        <div class="gallery-masonry" id="gallery-grid" aria-label="Artwork collection">
          <!-- Static placeholder for no-JS -->
          <noscript>
            <p>Please enable JavaScript to view the full gallery.</p>
          </noscript>
        </div>
      </div>
    </section>

  </main>
<script>
    var ARTWORKS = [];

    var currentFilter = 'all';

    function filterGallery(disc) {
      currentFilter = disc;
      document.querySelectorAll('.gallery-filter').forEach(function(btn) {
        var active = btn.getAttribute('onclick').includes("'" + disc + "'");
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      renderGallery();
    }

    function renderGallery() {
      var grid = document.getElementById('gallery-grid');
      if (!grid) return;
      var filtered = currentFilter === 'all'
        ? ARTWORKS
        : currentFilter === 'ar'
          ? ARTWORKS.filter(function(a) { return a.ar; })
          : ARTWORKS.filter(function(a) { return a.discipline === currentFilter; });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="gallery-placeholder"><span>&#128444;</span><span>No artworks in this category yet</span></div>';
        return;
      }

      grid.innerHTML = filtered.map(function(art, i) {
        var arBadge = art.ar ? '<span class="gallery-item__ar" aria-label="AR Ready">AR</span>' : '';
        var img = art.glb
          ? '<div class="gallery-placeholder" style="aspect-ratio:4/3"><span>&#127918;</span><span>View in WebAR</span></div>'
          : '<div class="gallery-placeholder" style="aspect-ratio:4/3"><span>&#128444;</span><span>' + (art.title || 'Artwork') + '</span></div>';
        return '<article class="gallery-item" onclick="openArtwork(' + i + ')" tabindex="0" role="button"' +
               ' aria-label="View ' + (art.title || 'artwork') + ' by ' + (art.artist || 'DIAT') + '">' +
               arBadge + img +
               '<div class="gallery-item__overlay">' +
               '<span class="gallery-item__disc">' + (art.disciplineLabel || art.discipline || '') + '</span>' +
               '<span class="gallery-item__title">' + (art.title || '[Artwork]') + '</span>' +
               '<span style="font-size:var(--fs-xs);color:rgba(255,255,255,.55)">' + (art.artist || '') + '</span>' +
               '</div></article>';
      }).join('');
    }

    function openArtwork(i) {
      var art = (currentFilter === 'all' ? ARTWORKS
        : currentFilter === 'ar' ? ARTWORKS.filter(function(a) { return a.ar; })
        : ARTWORKS.filter(function(a) { return a.discipline === currentFilter; }))[i];
      if (!art) return;
      if (art.ar && art.glb) {
        window.location.href = 'webar.html?art=' + encodeURIComponent(art.title);
      }
    }

    document.addEventListener('DOMContentLoaded', renderGallery);
  </script>
    <script src="site.js"></script>
  <script src="cms.js?v=3"></script>
</body>
</html>
