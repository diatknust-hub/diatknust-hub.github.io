<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AR test</title>
<script type="module"
  src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  body { margin: 0; font-family: sans-serif; background: #fff; color: #111; }
  model-viewer { width: 100%; height: 55vh; background: #eee; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
  .row button { padding: 10px 14px; font-size: 14px; border: 1px solid #999; border-radius: 8px; background: #fff; }
  .row button.on { background: #1a1a4e; color: #fff; border-color: #1a1a4e; }
  #status { padding: 0 16px 16px; font-size: 14px; line-height: 1.5; }
  button.ar { padding: 14px 24px; font-size: 16px; border: 0; border-radius: 24px;
              background: #c9952a; color: #fff; position: absolute; bottom: 16px; left: 50%;
              transform: translateX(-50%); }
</style>
</head>
<body>

<model-viewer id="mv"
  src="https://cdn.jsdelivr.net/gh/diatknust-hub/diatknust@main/ar-test-models/stool-test-original.glb"
  alt="Traditional Drum Stool test"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  shadow-intensity="1">
  <button slot="ar-button" class="ar">View in AR</button>
</model-viewer>

<div class="row" id="picker">
  <button data-src="https://cdn.jsdelivr.net/gh/diatknust-hub/diatknust@main/ar-test-models/stool-test-original.glb" class="on">1. Original</button>
  <button data-src="https://cdn.jsdelivr.net/gh/diatknust-hub/diatknust@main/ar-test-models/stool-test-normals.glb">2. Normals added</button>
  <button data-src="https://cdn.jsdelivr.net/gh/diatknust-hub/diatknust@main/ar-test-models/stool-test-lite.glb">3. Normals + lighter</button>
</div>

<div id="status">Loading…</div>

<script>
  var mv = document.getElementById('mv');
  var out = document.getElementById('status');
  var label = '1. Original';
  function say(t) { out.innerHTML += '<br>' + t; }
  out.textContent = 'Page loaded.';
  mv.addEventListener('load', function () {
    say('[' + label + '] model loaded. AR available: ' + mv.canActivateAR);
  });
  mv.addEventListener('error', function (e) {
    say('[' + label + '] model error: ' + (e.detail && e.detail.type ? e.detail.type : 'unknown'));
  });
  mv.addEventListener('ar-status', function (e) {
    say('[' + label + '] AR status: ' + e.detail.status);
  });
  document.getElementById('picker').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#picker button').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
    label = b.textContent;
    mv.setAttribute('src', b.getAttribute('data-src'));
  });
</script>
</body>
</html>
